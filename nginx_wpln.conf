# Nginx configuration for wpln.yaaletech.in
# Place in /etc/nginx/sites-available/wpln.yaaletech.in and symlink to sites-enabled/

server {
    listen 80;
    server_name wpln.yaaletech.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wpln.yaaletech.in;

    # SSL Certificates (managed by Certbot or existing SSL)
    # ssl_certificate /etc/letsencrypt/live/wpln.yaaletech.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/wpln.yaaletech.in/privkey.pem;

    # Frontend React static build
    root /var/www/wpln.yaaletech.in/frontend/dist;
    index index.html;

    client_max_body_size 50M;

    # Frontend SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API reverse proxy to Port 8412
    location /api/ {
        proxy_pass http://127.0.0.1:8412/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Uploads / Media assets proxy
    location /uploads/ {
        proxy_pass http://127.0.0.1:8412/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
